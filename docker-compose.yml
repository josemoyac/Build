version: '3.9'
services:
  api:
    build: ./apps/api
    env_file: .env.example
    ports:
      - "4000:4000"
    depends_on:
      - postgres
      - redis
      - minio
    volumes:
      - ./apps/api:/app
      - ./packages:/workspace/packages
      - ./prisma:/workspace/prisma
    command: pnpm start:dev
  web:
    build: ./apps/web
    env_file: .env.example
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ./apps/web:/app
      - ./packages:/workspace/packages
    command: pnpm dev
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: build
      POSTGRES_USER: build
      POSTGRES_PASSWORD: build
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  minio:
    image: minio/minio:RELEASE.2024-03-30T00-00-00Z
    environment:
      MINIO_ROOT_USER: build
      MINIO_ROOT_PASSWORD: buildsecret
    command: server /data
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "8025:8025"
volumes:
  postgres-data:
  minio-data:
