apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "build.fullname" . }}-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "build.fullname" . }}-api
  template:
    metadata:
      labels:
        app: {{ include "build.fullname" . }}-api
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 4000
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "build.fullname" . }}-api
spec:
  selector:
    app: {{ include "build.fullname" . }}-api
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 4000
