apiVersion: apps/v1
kind: Deployment
metadata:
  name: build-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: build-api
  template:
    metadata:
      labels:
        app: build-api
    spec:
      containers:
        - name: api
          image: build/api:latest
          env:
            - name: NODE_ENV
              value: production
          ports:
            - containerPort: 4000
---
apiVersion: v1
kind: Service
metadata:
  name: build-api
spec:
  selector:
    app: build-api
  ports:
    - port: 80
      targetPort: 4000
