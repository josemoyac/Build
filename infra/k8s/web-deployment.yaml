apiVersion: apps/v1
kind: Deployment
metadata:
  name: build-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: build-web
  template:
    metadata:
      labels:
        app: build-web
    spec:
      containers:
        - name: web
          image: build/web:latest
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: build-web
spec:
  selector:
    app: build-web
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
  type: ClusterIP
